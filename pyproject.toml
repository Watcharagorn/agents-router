[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-router"
version = "0.5.0"
description = "Let your coding agent delegate tasks to other installed agent CLIs, each in its own harness under your own login, with one shared setup across accounts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Watcharagorn" }]
keywords = ["mcp", "subagents", "claude-code", "codex", "coding-agents", "multi-account"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Watcharagorn/agents-router"

[project.scripts]
agt = "agents_router.cli:main"
agents-router-mcp = "agents_router.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agents_router" = ["templates/*.md", "templates/codex-agents/*.toml", "templates/antigravity-plugin/plugin.json", "templates/antigravity-plugin/agents/*.md"]
"agents_router.agy_review" = ["policy.md"]

[tool.uv]
# A folder install (`uv tool install <checkout>`) rebuilds when the code changes, not only pyproject.toml.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.md" }, { file = "src/**/*.toml" }, { file = "src/**/*.json" }]
