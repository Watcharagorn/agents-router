[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-router"
version = "0.8.1"
description = "Keep agents, skills, MCP servers and instruction files in sync between Claude Code, Codex CLI, Kiro CLI and Antigravity, and run subagents in those CLIs on your own accounts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Watcharagorn" }]
keywords = [
    "claude-code", "codex", "codex-cli", "kiro", "kiro-cli", "antigravity", "gemini", "mcp", "mcp-server",
    "subagents", "agent-skills", "coding-agents", "ai-agents", "multi-account",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Watcharagorn/agents-router"
Repository = "https://github.com/Watcharagorn/agents-router"
Documentation = "https://github.com/Watcharagorn/agents-router/blob/main/docs/README.md"

[project.scripts]
agt = "agents_router.cli:main"
agents-router-mcp = "agents_router.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agents_router" = ["templates/*.md", "templates/codex-agents/*.toml", "templates/antigravity-plugin/plugin.json", "templates/antigravity-plugin/agents/*.md"]
"agents_router.agy_review" = ["policy.md"]

[tool.uv]
# A folder install (`uv tool install <checkout>`) rebuilds when the code changes, not only pyproject.toml.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.md" }, { file = "src/**/*.toml" }, { file = "src/**/*.json" }]
