schema_version: "1.1"
name: redesign-proposes-first
expected_outcome: |
  The agent looks at what the user has (agt roles show --json, agt accounts list --json), runs agt roles propose --json and saves it to a file, shows the whole proposed table (role, access, providers in order, reason) with what differs from today's, and asks once whether to save it. Nothing is written before the user approves; the write it offers is agt roles config --from <that file> --user-said.
context:
  scaffold_script: place-files.sh
