name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: python -m pip install "rich>=14.3.4,<16" "rich-argparse>=1.8,<2"
      - name: Core tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/tests
        run: python -m unittest discover -s tests -t tests -v

  antigravity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Antigravity adapter tests
        working-directory: adapters/antigravity
        run: python -m unittest discover -s tests -v
